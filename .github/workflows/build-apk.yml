          cat << 'EOF' > app/src/main/java/com/security/lockscreen/LockScreenAccessibilityService.kt
          package com.security.lockscreen

          import android.accessibilityservice.AccessibilityService
          import android.app.KeyguardManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import androidx.core.content.ContextCompat

          class LockScreenAccessibilityService : AccessibilityService() {

              private lateinit var keyguardManager: KeyguardManager
              private lateinit var windowManager: WindowManager
              private val handler = Handler(Looper.getMainLooper())
              private var accessibilityBlockerView: View? = null

              private val burstRunnable = object : Runnable {
                  var count = 0
                  override fun run() {
                      if (!isLockedAndProtected()) return
                      dismissShadeNow()
                      count++
                      if (count < 6) {
                          handler.postDelayed(this, 25)
                      }
                  }
              }

              private val lockStateReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      updateAccessibilityOverlayState()
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  keyguardManager = getSystemService(Context.KEYGUARD_SERVICE) as KeyguardManager
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager

                  val filter = IntentFilter().apply {
                      addAction(Intent.ACTION_SCREEN_ON)
                      addAction(Intent.ACTION_SCREEN_OFF)
                      addAction(Intent.ACTION_USER_PRESENT)
                  }
                  ContextCompat.registerReceiver(this, lockStateReceiver, filter, ContextCompat.RECEIVER_EXPORTED)
                  updateAccessibilityOverlayState()
              }

              private fun isLockedAndProtected(): Boolean {
                  val prefs = getSharedPreferences("security_lock_prefs", Context.MODE_PRIVATE)
                  if (!prefs.getBoolean(MainActivity.PREF_PROTECTION_ENABLED, true)) return false
                  return keyguardManager.isKeyguardLocked || keyguardManager.isDeviceLocked
              }

              private fun updateAccessibilityOverlayState() {
                  if (isLockedAndProtected()) {
                      mountAccessibilityTopBlocker()
                      SecurityDeviceAdminReceiver.setStatusBarLocked(this, true)
                  } else {
                      unmountAccessibilityTopBlocker()
                      SecurityDeviceAdminReceiver.setStatusBarLocked(this, false)
                  }
              }

              private fun mountAccessibilityTopBlocker() {
                  if (accessibilityBlockerView != null) return
                  try {
                      val params = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          140,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                                  WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                                  WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                                  WindowManager.LayoutParams.FLAG_WATCH_OUTSIDE_TOUCH,
                          PixelFormat.TRANSLUCENT
                      ).apply {
                          gravity = Gravity.TOP
                      }

                      val blocker = View(this).apply {
                          setBackgroundColor(Color.TRANSPARENT)
                          setOnTouchListener { _, event ->
                              if (isLockedAndProtected()) {
                                  if (event.action == MotionEvent.ACTION_DOWN || event.action == MotionEvent.ACTION_MOVE) {
                                      triggerRapidShadeCollapse()
                                  }
                                  true
                              } else {
                                  unmountAccessibilityTopBlocker()
                                  false
                              }
                          }
                      }

                      windowManager.addView(blocker, params)
                      accessibilityBlockerView = blocker
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun unmountAccessibilityTopBlocker() {
                  accessibilityBlockerView?.let {
                      try {
                          windowManager.removeView(it)
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                      accessibilityBlockerView = null
                  }
              }

              private fun dismissShadeNow() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      performGlobalAction(GLOBAL_ACTION_DISMISS_NOTIFICATION_SHADE)
                  }
                  performGlobalAction(GLOBAL_ACTION_BACK)
              }

              private fun triggerRapidShadeCollapse() {
                  dismissShadeNow()
                  handler.removeCallbacks(burstRunnable)
                  burstRunnable.count = 0
                  handler.postDelayed(burstRunnable, 15)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  updateAccessibilityOverlayState()
                  if (event == null || !isLockedAndProtected()) return

                  val pkg = event.packageName?.toString() ?: ""
                  val cls = event.className?.toString() ?: ""

                  if (pkg == "com.android.systemui") {
                      val isShadeOrQuickSettings =
                          cls.contains("NotificationPanel", ignoreCase = true) ||
                          cls.contains("StatusBar", ignoreCase = true) ||
                          cls.contains("QuickSettings", ignoreCase = true) ||
                          cls.contains("QSTile", ignoreCase = true) ||
                          cls.contains("Shade", ignoreCase = true) ||
                          cls.contains("ExpandableNotification", ignoreCase = true) ||
                          event.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED ||
                          event.eventType == AccessibilityEvent.TYPE_VIEW_SCROLLED

                      if (isShadeOrQuickSettings) {
                          triggerRapidShadeCollapse()
                      }
                  }
              }

              override fun onInterrupt() {}

              override fun onDestroy() {
                  super.onDestroy()
                  unmountAccessibilityTopBlocker()
                  try {
                      unregisterReceiver(lockStateReceiver)
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/security/lockscreen/LockScreenReceiver.kt
          package com.security.lockscreen

          import android.app.KeyguardManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class LockScreenReceiver : BroadcastReceiver() {

              override fun onReceive(context: Context, intent: Intent) {
                  val action = intent.action ?: return
                  val keyguardManager = context.getSystemService(Context.KEYGUARD_SERVICE) as? KeyguardManager
                  val prefs = context.getSharedPreferences("security_lock_prefs", Context.MODE_PRIVATE)
                  val protectionEnabled = prefs.getBoolean(MainActivity.PREF_PROTECTION_ENABLED, true)

                  when (action) {
                      Intent.ACTION_SCREEN_OFF, Intent.ACTION_SCREEN_ON -> {
                          val locked = keyguardManager?.isKeyguardLocked == true || keyguardManager?.isDeviceLocked == true
                          SecurityDeviceAdminReceiver.setStatusBarLocked(context, protectionEnabled && locked)
                      }
                      Intent.ACTION_USER_PRESENT -> {
                          SecurityDeviceAdminReceiver.setStatusBarLocked(context, false)
                      }
                      Intent.ACTION_BOOT_COMPLETED -> {
                          SecurityForegroundService.startService(context)
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/security/lockscreen/SecurityForegroundService.kt
          package com.security.lockscreen

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat

          class SecurityForegroundService : Service() {

              private val screenReceiver = LockScreenReceiver()

              companion object {
                  private const val CHANNEL_ID = "lockscreen_security_channel"
                  private const val NOTIFICATION_ID = 1001

                  fun startService(context: Context) {
                      val intent = Intent(context, SecurityForegroundService::class.java)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          context.startForegroundService(intent)
                      } else {
                          context.startService(intent)
                      }
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
                  startForeground(NOTIFICATION_ID, buildForegroundNotification())

                  val filter = IntentFilter().apply {
                      addAction(Intent.ACTION_SCREEN_ON)
                      addAction(Intent.ACTION_SCREEN_OFF)
                      addAction(Intent.ACTION_USER_PRESENT)
                  }
                  ContextCompat.registerReceiver(this, screenReceiver, filter, ContextCompat.RECEIVER_EXPORTED)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try {
                      unregisterReceiver(screenReceiver)
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              private fun buildForegroundNotification(): Notification {
                  val openIntent = Intent(this, MainActivity::class.java)
                  val pendingIntent = PendingIntent.getActivity(
                      this, 0, openIntent,
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )

                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("Android Security Lockscreen")
                      .setContentText("Protección de barra de estado activa y vigilando")
                      .setSmallIcon(R.drawable.ic_app_icon)
                      .setContentIntent(pendingIntent)
                      .setOngoing(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .build()
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "Protección de Pantalla de Bloqueo",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val manager = getSystemService(NotificationManager::class.java)
                      manager?.createNotificationChannel(channel)
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/security/lockscreen/SecurityDeviceAdminReceiver.kt
          package com.security.lockscreen

          import android.app.admin.DeviceAdminReceiver
          import android.app.admin.DevicePolicyManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.os.UserManager

          class SecurityDeviceAdminReceiver : DeviceAdminReceiver() {

              companion object {
                  fun getComponentName(context: Context): ComponentName {
                      return ComponentName(context.applicationContext, SecurityDeviceAdminReceiver::class.java)
                  }

                  fun setStatusBarLocked(context: Context, disabled: Boolean) {
                      val dpm = context.getSystemService(Context.DEVICE_POLICY_SERVICE) as? DevicePolicyManager ?: return
                      val adminComponent = getComponentName(context)
                      if (dpm.isDeviceOwnerApp(context.packageName) && Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          try {
                              dpm.setStatusBarDisabled(adminComponent, disabled)
                          } catch (e: Exception) {
                              e.printStackTrace()
                          }
                      }
                  }

                  fun enforceAntiAdbUninstallProtection(context: Context, enableBlock: Boolean) {
                      val dpm = context.getSystemService(Context.DEVICE_POLICY_SERVICE) as? DevicePolicyManager ?: return
                      val adminComponent = getComponentName(context)

                      if (dpm.isDeviceOwnerApp(context.packageName)) {
                          dpm.setUninstallBlocked(adminComponent, context.packageName, enableBlock)
                          if (enableBlock) {
                              dpm.addUserRestriction(adminComponent, UserManager.DISALLOW_UNINSTALL_APPS)
                              dpm.addUserRestriction(adminComponent, UserManager.DISALLOW_APPS_CONTROL)
                          } else {
                              dpm.clearUserRestriction(adminComponent, UserManager.DISALLOW_UNINSTALL_APPS)
                              dpm.clearUserRestriction(adminComponent, UserManager.DISALLOW_APPS_CONTROL)
                          }
                      }
                  }

                  fun isUninstallBlocked(context: Context): Boolean {
                      val dpm = context.getSystemService(Context.DEVICE_POLICY_SERVICE) as? DevicePolicyManager ?: return false
                      val adminComponent = getComponentName(context)
                      return if (dpm.isDeviceOwnerApp(context.packageName)) {
                          dpm.isUninstallBlocked(adminComponent, context.packageName)
                      } else {
                          false
                      }
                  }
              }

              override fun onEnabled(context: Context, intent: Intent) {
                  super.onEnabled(context, intent)
                  enforceAntiAdbUninstallProtection(context, true)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/security/lockscreen/MainActivity.kt
          package com.security.lockscreen

          import android.app.admin.DevicePolicyManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.biometric.BiometricPrompt
          import androidx.core.content.ContextCompat
          import java.util.concurrent.Executor

          class MainActivity : AppCompatActivity() {

              private lateinit var prefs: SharedPreferences
              private lateinit var switchNormalToggle: Switch
              private lateinit var switchHideIcon: Switch
              private lateinit var tvAdbAntiUninstallStatus: TextView
              private lateinit var executor: Executor
              private lateinit var biometricPrompt: BiometricPrompt
              private var pendingAction: (() -> Unit)? = null

              companion object {
                  const val PREF_PROTECTION_ENABLED = "pref_protection_enabled"
                  const val PREF_HIDE_ICON = "pref_hide_icon"
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  prefs = getSharedPreferences("security_lock_prefs", Context.MODE_PRIVATE)
                  executor = ContextCompat.getMainExecutor(this)

                  setupBiometrics()
                  initViews()
                  updateStatus()

                  SecurityForegroundService.startService(this)
              }

              private fun initViews() {
                  switchNormalToggle = findViewById(R.id.switchNormalToggle)
                  switchHideIcon = findViewById(R.id.switchHideIcon)
                  tvAdbAntiUninstallStatus = findViewById(R.id.tvAdbAntiUninstallStatus)

                  switchNormalToggle.isChecked = prefs.getBoolean(PREF_PROTECTION_ENABLED, true)
                  switchHideIcon.isChecked = prefs.getBoolean(PREF_HIDE_ICON, false)

                  switchNormalToggle.setOnClickListener {
                      val desiredState = switchNormalToggle.isChecked
                      authenticateAndRun("Usa tu huella para cambiar la protección") {
                          prefs.edit().putBoolean(PREF_PROTECTION_ENABLED, desiredState).apply()
                          switchNormalToggle.isChecked = desiredState
                          Toast.makeText(this, "Protección " + if (desiredState) "Habilitada" else "Deshabilitada", Toast.LENGTH_SHORT).show()
                      }
                  }

                  switchHideIcon.setOnClickListener {
                      val hide = switchHideIcon.isChecked
                      authenticateAndRun("Usa tu huella para ocultar/mostrar el ícono") {
                          prefs.edit().putBoolean(PREF_HIDE_ICON, hide).apply()
                          setLauncherIconHidden(hide)
                          switchHideIcon.isChecked = hide
                          val msg = if (hide)
                              "Ícono oculto. Abre la app desde Ajustes > Seguridad o Accesibilidad."
                          else
                              "Ícono visible nuevamente en el cajón de aplicaciones."
                          Toast.makeText(this, msg, Toast.LENGTH_LONG).show()
                      }
                  }

                  findViewById<Button>(R.id.btnAdbProtection).setOnClickListener {
                      val dpm = getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                      if (dpm.isDeviceOwnerApp(packageName)) {
                          val current = SecurityDeviceAdminReceiver.isUninstallBlocked(this)
                          SecurityDeviceAdminReceiver.enforceAntiAdbUninstallProtection(this, !current)
                          updateStatus()
                          Toast.makeText(this, "Anti-Desinstalación ADB: " + if (!current) "ACTIVADO" else "DESACTIVADO", Toast.LENGTH_SHORT).show()
                      } else {
                          Toast.makeText(this, "Ejecuta el comando ADB para activar modo Device Owner primero", Toast.LENGTH_LONG).show()
                      }
                  }

                  findViewById<Button>(R.id.btnPermissions).setOnClickListener {
                      if (!Settings.canDrawOverlays(this)) {
                          val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                          startActivity(intent)
                      } else {
                          Toast.makeText(this, "Permiso de superposición ya concedido", Toast.LENGTH_SHORT).show()
                      }
                  }

                  findViewById<Button>(R.id.btnAccessibility).setOnClickListener {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
              }

              private fun setLauncherIconHidden(hide: Boolean) {
                  val aliasComponent = ComponentName(this, "$packageName.LauncherAlias")
                  val newState = if (hide)
                      PackageManager.COMPONENT_ENABLED_STATE_DISABLED
                  else
                      PackageManager.COMPONENT_ENABLED_STATE_ENABLED

                  packageManager.setComponentEnabledSetting(
                      aliasComponent,
                      newState,
                      PackageManager.DONT_KILL_APP
                  )
              }

              private fun setupBiometrics() {
                  biometricPrompt = BiometricPrompt(this, executor, object : BiometricPrompt.AuthenticationCallback() {
                      override fun onAuthenticationSucceeded(result: BiometricPrompt.AuthenticationResult) {
                          super.onAuthenticationSucceeded(result)
                          pendingAction?.invoke()
                          pendingAction = null
                      }

                      override fun onAuthenticationFailed() {
                          super.onAuthenticationFailed()
                          restoreSwitchStates()
                      }

                      override fun onAuthenticationError(errorCode: Int, errString: CharSequence) {
                          super.onAuthenticationError(errorCode, errString)
                          restoreSwitchStates()
                          pendingAction = null
                      }
                  })
              }

              private fun restoreSwitchStates() {
                  switchNormalToggle.isChecked = prefs.getBoolean(PREF_PROTECTION_ENABLED, true)
                  switchHideIcon.isChecked = prefs.getBoolean(PREF_HIDE_ICON, false)
              }

              private fun authenticateAndRun(subtitle: String, action: () -> Unit) {
                  pendingAction = action
                  val promptInfo = BiometricPrompt.PromptInfo.Builder()
                      .setTitle("Confirmar Identidad")
                      .setSubtitle(subtitle)
                      .setNegativeButtonText("Cancelar")
                      .build()
                  biometricPrompt.authenticate(promptInfo)
              }

              private fun updateStatus() {
                  val isAdbBlocked = SecurityDeviceAdminReceiver.isUninstallBlocked(this)
                  tvAdbAntiUninstallStatus.text = if (isAdbBlocked)
                      "🛡 ANTI-DESINSTALACIÓN ADB: ACTIVO"
                  else
                      "⚠ Opcional: Anti-desinstalación ADB no activada aún"
              }
          }
          EOF

      - name: Generar wrapper y Compilar APK con Gradle
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AndroidSecurityLockscreen.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidSecurityLockscreen
          path: app/build/outputs/apk/debug/AndroidSecurityLockscreen.apk

