name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generar estructura completa del proyecto Android
        run: |
          mkdir -p app/src/main/java/com/security/lockscreen
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          if [ -f "icono.png" ]; then
            cp icono.png app/src/main/res/drawable/ic_app_icon.png
          else
            cat << 'EOF' > app/src/main/res/drawable/ic_app_icon.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#E11D48"
                  android:pathData="M24,0 L84,0 C97.25,0 108,10.75 108,24 L108,84 C108,97.25 97.25,108 84,108 L24,108 C10.75,108 0,97.25 0,84 L0,24 C0,10.75 10.75,0 24,0 Z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,20 L82,32 L82,53 C82,71.5 70,85.5 54,91 C38,85.5 26,71.5 26,53 L26,32 L54,20 Z" />
              <path
                  android:fillColor="#E11D48"
                  android:pathData="M54,27 L76,37 L76,53 C76,68 66.5,79.5 54,84.5 C41.5,79.5 32,68 32,53 L32,37 L54,27 Z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M48,50 a6,6 0 1,0 12,0 a6,6 0 1,0 -12,0 M51,54 L57,54 L59,68 L49,68 Z" />
          </vector>
          EOF
          fi

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AndroidSecurityLockscreen"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.security.lockscreen"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.security.lockscreen"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 3
